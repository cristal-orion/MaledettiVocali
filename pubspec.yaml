name: maledetti_vocali
description: "Trascrive i messaggi vocali condivisi da WhatsApp, Telegram e altre app."
publish_to: 'none'
# IMPORTANTE: il numero dopo il "+" e' il versionCode Android. Va incrementato
# a OGNI APK distribuita, altrimenti l'aggiornamento sopra una versione
# installata fallisce con "App non installata".
version: 1.3.0+4

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  receive_sharing_intent: ^1.6.0
  path_provider: ^2.0.11
  dio: ^5.1.1
  shared_preferences: ^2.0.15
  firebase_core: ^2.13.0
  firebase_analytics: ^10.4.3
  firebase_crashlytics: ^3.3.2
  share_plus: ^7.0.0
  permission_handler: ^11.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^3.0.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "LogoMaledettivocali.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "LogoMaledettivocali.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
